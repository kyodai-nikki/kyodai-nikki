<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Gallery dummy image</title>
  <desc id="desc">A simple placeholder illustration for testing the gallery layout and modal.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e7d8" />
      <stop offset="45%" stop-color="#d7e7f7" />
      <stop offset="100%" stop-color="#e9eef6" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <circle cx="205" cy="160" r="120" fill="#ffffff" fill-opacity="0.5" />
  <circle cx="1030" cy="630" r="160" fill="#ffffff" fill-opacity="0.45" />
  <circle cx="930" cy="165" r="92" fill="#f2c6cf" fill-opacity="0.55" />

  <g transform="translate(146 122)">
    <rect width="908" height="556" rx="20" fill="url(#card)" stroke="#111111" stroke-opacity="0.2" />
    <rect x="46" y="46" width="816" height="464" rx="12" fill="#ffffff" fill-opacity="0.82" />

    <rect x="90" y="94" width="312" height="332" rx="14" fill="#1e2a39" />
    <rect x="434" y="94" width="384" height="106" rx="14" fill="#dfe7f1" />
    <rect x="434" y="222" width="384" height="88" rx="14" fill="#f5d9df" />
    <rect x="434" y="332" width="384" height="94" rx="14" fill="#ebf0f5" />

    <circle cx="192" cy="224" r="58" fill="#f6e7d8" />
    <circle cx="298" cy="224" r="58" fill="#d7e7f7" />
    <path d="M146 332c26-56 82-90 151-90s126 34 152 90" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

    <text x="434" y="160" fill="#111111" font-size="56" font-family="Noto Serif JP, serif">Gallery</text>
    <text x="434" y="274" fill="#4a4a4a" font-size="34" font-family="Noto Sans JP, sans-serif">dummy artwork for popup test</text>
    <text x="434" y="386" fill="#666666" font-size="28" font-family="Noto Sans JP, sans-serif">click to confirm modal layout</text>
